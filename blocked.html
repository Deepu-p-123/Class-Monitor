<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blocked</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      color: #2c3e50;
    }

    .card {
      max-width: 420px;
      padding: 32px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .teacher-icon {
      width: 64px;
      height: 64px;
      color: #2c3e50;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 12px;
    }

    p {
      font-size: 15px;
      line-height: 1.5;
      margin: 0;
      color: #555;
    }
  </style>
</head>
<body>
  <main class="card">
    <svg
      class="teacher-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <circle cx="12" cy="6" r="3"></circle>
      <path d="M4 21v-1a8 8 0 0 1 16 0v1"></path>
      <path d="M8 12h8"></path>
      <path d="M9 15h6"></path>
    </svg>

    <h1>This site is not available during class</h1>
    <p>AI tools are restricted during class hours. Ask your teacher if you need access.</p>
  </main>
</body>
</html>
